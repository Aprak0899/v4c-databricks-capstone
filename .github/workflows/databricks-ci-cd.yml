# Minimal GitHub Actions workflow for Databricks (DABs)
# - Unit tests run on PR to dev and on push to dev
# - Build checks bundle and can be extended with deploy
name: Databricks CI/CD
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
jobs:
  test:
    name: Unit tests (bronze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pyspark pytest
      - name: Run bronze unit tests
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Bundle check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Check bundle file
        run: |
          if [ -f databricks.yml ]; then echo "databricks.yml found"; else echo "databricks.yml missing"; exit 1; fi

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@v1
        with:
          version: 0.280.0

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev
        continue-on-error: true

      # Deploy only on push to dev (not on PR). If secrets are missing, step will fail at run time.
      - name: Deploy bundle to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t dev
