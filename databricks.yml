bundle:
  name: v4c-databricks-capstone

variables:
  landing_base:
    default: /Volumes/dev_automotive/landing/landing_raw
  csv_to_json_input:
    default: catalogs.csv
  csv_to_json_output:
    default: catalogs.json
  csv_to_xml_input:
    default: final_geografic.csv
  csv_to_xml_output:
    default: final_geografic.xml

resources:
  jobs:
    Chunk_1_job:
      name: Chunk 1 job
      tasks:
        - task_key: Bronze_Ingestion_csv
          sql_task:
            file:
              path: src/jobs/chunk_1_ingestion_csv/01_Chunk_01_Bronze.sql
              source: WORKSPACE
            warehouse_id: 27741dfb3e277ed5

    data_chunking:
      name: Data Chunking (Serverless)
      tasks:
        - task_key: csv_to_json
          notebook_task:
            notebook_path: src/jobs/data_chunking/csv_to_json.ipynb
            base_parameters:
              input_path: "{{ landing_base }}/{{ csv_to_json_input }}"
              output_path: "{{ landing_base }}/{{ csv_to_json_output }}"

        - task_key: csv_to_xml
          depends_on:
            - task_key: csv_to_json
          notebook_task:
            notebook_path: src/jobs/data_chunking/csv_to_xml.ipynb
            base_parameters:
              input_path: "{{ landing_base }}/{{ csv_to_xml_input }}"
              output_path: "{{ landing_base }}/{{ csv_to_xml_output }}"

  pipelines:
    automotive_pipeline:
      name: automotive_pipeline
      catalog: dev_automotive
      schema: bronze
      photon: true
      serverless: true
      channel: CURRENT
      continuous: false
      development: false
      libraries:
        - glob:
            include: src/pipelines/automotive_pipeline/transformations/**
        - glob:
            include: src/pipelines/automotive_pipeline/bronze/bronze_main_raw.py
        - glob:
            include: src/pipelines/automotive_pipeline/bronze/bronze_catalogs.py
        - glob:
            include: src/pipelines/automotive_pipeline/silver/silver_catalogs.py
        - glob:
            include: src/pipelines/automotive_pipeline/silver/silver_main.py

targets:
  dev:
    workspace:
      host: https://dbc-38c502e9-24ad.cloud.databricks.com